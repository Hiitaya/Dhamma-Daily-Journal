    const { useState, useEffect, useRef } = React;

    function App() {
      const [currentBoard, setCurrentBoard] = useState(0);

      const [isBreathingIn, setIsBreathingIn] = useState(true);
      const [isSoundEnabled, setIsSoundEnabled] = useState(true); // ⭐️ State เปิด-ปิดเสียง

      // Tibetan Singing Bowl 528Hz Synthesizer (เคารพค่า isSoundEnabled)
      const playZenBell = (forcePlay = false) => {
        if (!isSoundEnabled && !forcePlay) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (!AudioContext) return;
          const ctx = new AudioContext();
          
          const fundamental = 528;
          const harmonics = [1, 2.76, 5.4, 8.1];
          const gains = [0.35, 0.15, 0.07, 0.02];

          harmonics.forEach((h, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = i === 0 ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(fundamental * h, ctx.currentTime);

            gain.gain.setValueAtTime(gains[i], ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 3.0);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 3.0);
          });
        } catch (e) {
          console.log('AudioContext error', e);
        }
      };

      // ฟังก์ชันสลับสถานะเปิด/ปิดเสียง
      const toggleSound = () => {
        const nextState = !isSoundEnabled;
        setIsSoundEnabled(nextState);
        // ถ้ากดเปิด ให้ตีระฆังเบาๆ 1 ทีเพื่อยืนยันว่าเปิดแล้ว
        if (nextState) {
          playZenBell(true);
        }
      };

      // Auto-breath toggler
      useEffect(() => {
        const interval = setInterval(() => {
          setIsBreathingIn(prev => !prev);
        }, 3000);
        return () => clearInterval(interval);
      }, []);

          boardNo: "2026-10-07 เรียนกระดาน 1"
        },
        {

          subtitle: "เห็นความเกิดดับของลมหายใจและร่างกายในปัจจุบันเวลา",
          boardNo: "2026-10-07 เรียนกระดาน 2"
        },
        {
          id: "board3",
          level: "ป.เอก",
          tagColor: "bg-sageGreen text-white",
          title: "พระธรรมเป็นเครื่องกำจัดทุกข์ (จับไอ้วอก)",
          subtitle: "ตั้งฐานกายคตาสติ รู้ทันขันธ์ 5 เปลี่ยนสู่ความว่าง",
          boardNo: "2026-10-07 เรียนกระดาน 3"
        }
      ];

      const handleBoardChange = (idx) => {
        setCurrentBoard(idx);
        if (isSoundEnabled) {
          playZenBell();
        }
      };

              >

                Back to School (7 ต.ค. 2569)
              </span>

            {/* Board Selector Tabs & Sound Toggle */}

              {boards.map((b, idx) => (
                <button
                  key={b.id}
